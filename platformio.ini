[platformio]
src_dir = ESP32-Chademo
data_dir = ESP32-Chademo/data

[env:esp32dev]
; LC-Relay-ESP32-4R-A2 carries an ESP32-WROOM-32E with 4MB flash.
; Pinned to platform 6.x: the Arduino ESP32 core 3.x drops the timerBegin/timerAlarmWrite API this sketch uses.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.filesystem = spiffs
monitor_speed = 115200
upload_speed = 460800
build_flags = -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
lib_deps =
	pierremolinaro/ACAN_ESP32@^1.1.1
	bblanchon/ArduinoJson@^6.21.5
	ayushsharma82/ElegantOTA@^3.1.7
	esp32async/ESPAsyncWebServer@^3.7.0
	esp32async/AsyncTCP@^3.4.0

; Bench only: same firmware with the brownout detector switched off, for probing a board whose
; supply still sags. Not for a run on a charger.
[env:benchtest]
extends = env:esp32dev
build_flags = -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1 -D DISABLE_BROWNOUT=1

; Confirms the relay and LED pin map on a bare board before anything is wired up.
[env:relaytest]
extends = env:esp32dev
build_flags =
lib_deps =
build_src_filter = -<*> +<../tools/relaytest/>
