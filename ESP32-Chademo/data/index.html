<!doctype html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ESP32-Chademo</title>
<link href="style.css" rel="stylesheet" type="text/css" />
<script src="highcharts.js" type="text/javascript"></script>
<script src="highcharts-more.js" type="text/javascript"></script>
<script src="solid-gauge.js" type="text/javascript"></script>
<script src="gauges.js" type="text/javascript"></script>
<script src="index.js" type="text/javascript"></script>
</head>
<body onload="onLoad()">

<header class="topbar">
	<span class="topbar-label">Chademo Status</span>
	<span class="topbar-state" id="mode">Waiting</span>
</header>

<div id="output">

	<div class="actions">
		<button type="button" id="start1">Override Start 1</button>
		<button type="button" id="start2">Override Start 2</button>
	</div>
	<p class="hint">Override replaces the charge sequence signals d1 and d2 when the charger will not start.</p>

	<nav class="links">
		<a href="/diag.html">Diagnose</a>
		<a href="/settings.html">Settings</a>
		<a href="/wifi">Wifi</a>
		<a href="/update">Update</a>
	</nav>

	<div class="gauges">
		<div id="container-voltage" class="chart-container"></div>
		<div id="container-current" class="chart-container"></div>
		<div id="container-power" class="chart-container"></div>
		<div id="container-soc" class="chart-container"></div>
	</div>

	<h2 class="section">EVSE</h2>
	<div class="cards">
		<div class="card"><span class="card-label">Max Voltage</span><span class="card-value"><span id="evseVoltage">-</span> V</span></div>
		<div class="card"><span class="card-label">Threshold</span><span class="card-value"><span id="evseThreshold">-</span> V</span></div>
		<div class="card"><span class="card-label">Max Current</span><span class="card-value"><span id="evseAmps">-</span> A</span></div>
	</div>

	<h2 class="section">Signals</h2>
	<div class="cards">
		<div class="card"><span class="card-label">IN 1 (d1)</span><span class="card-value" id="in1">-</span></div>
		<div class="card"><span class="card-label">IN 2 (d2)</span><span class="card-value" id="in2">-</span></div>
		<div class="card"><span class="card-label">OUT 1 (RY1)</span><span class="card-value" id="out1">-</span></div>
		<div class="card"><span class="card-label">OUT 2 (RY2)</span><span class="card-value" id="out2">-</span></div>
		<div class="card"><span class="card-label">Override 1</span><span class="card-value" id="over1">-</span></div>
		<div class="card"><span class="card-label">Override 2</span><span class="card-value" id="over2">-</span></div>
	</div>

</div>

<details class="logbox">
	<summary>Log</summary>
	<button type="button" id="saveLog">Save Log</button>
	<textarea id="log"></textarea>
</details>

</body>
</html>
